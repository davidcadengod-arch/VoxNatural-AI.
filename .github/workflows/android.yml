name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Fetch pinned neural runtime and model
        run: |
          mkdir -p app/libs app/src/main/assets/kokoro
          curl -fL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-1.13.8.aar -o app/libs/sherpa.aar
          curl -fL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2 -o /tmp/kokoro.tar.bz2
          tar -xjf /tmp/kokoro.tar.bz2 -C /tmp
          cp /tmp/kokoro-multi-lang-v1_0/{model.onnx,voices.bin,tokens.txt} app/src/main/assets/kokoro/
          cp -r /tmp/kokoro-multi-lang-v1_0/espeak-ng-data app/src/main/assets/kokoro/
          mkdir -p app/src/main/assets/piper
          curl -fL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-es_ES-davefx-medium.tar.bz2 -o /tmp/piper.tar.bz2
          tar -xjf /tmp/piper.tar.bz2 -C /tmp
          P=/tmp/vits-piper-es_ES-davefx-medium
          cp "$P/es_ES-davefx-medium.onnx" app/src/main/assets/piper/model.onnx
          cp "$P/tokens.txt" app/src/main/assets/piper/
          cp -r "$P/espeak-ng-data" app/src/main/assets/piper/
          mkdir -p app/src/main/assets/supertonic
          curl -fL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2 -o /tmp/supertonic.tar.bz2
          tar -xjf /tmp/supertonic.tar.bz2 -C /tmp
          S=/tmp/sherpa-onnx-supertonic-3-tts-int8-2026-05-11
          cp "$S"/{duration_predictor.int8.onnx,text_encoder.int8.onnx,vector_estimator.int8.onnx,vocoder.int8.onnx,tts.json,unicode_indexer.bin,voice.bin} app/src/main/assets/supertonic/
          curl -fL --retry 3 https://huggingface.co/Supertone/supertonic-3/resolve/main/LICENSE -o app/src/main/assets/supertonic/LICENSE
      - name: Compile native MP3 encoder
        run: bash scripts/build-mp3.sh
      - run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK
        run: |
          unzip -t app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep libvoxmp3.so
      - uses: actions/upload-artifact@v4
        with:
          name: VoxNatural-Android-alpha
          path: app/build/outputs/apk/debug/app-debug.apk
