name: Experimental Android runtime 2.0.1 with UNAM
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android-runtime-experiment.yml']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35 is available
        run: |
          if [[ -s "$ANDROID_HOME/platforms/android-35/android.jar" && -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]]; then
            exit 0
          fi
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platforms;android-35" "build-tools;35.0.0"
      - name: Fetch pinned neural runtime and model
        run: |
          mkdir -p app/libs app/src/main/assets/kokoro
          curl -fL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar -o app/libs/sherpa.aar
          echo "a8d09d1d32f3eb8520482c6d3d43fae674681c5b050385967c70a3c2c9bf0ee7  app/libs/sherpa.aar" | sha256sum -c -
          curl -fL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2 -o /tmp/kokoro.tar.bz2
          echo "60703707bc05ccd48d60e1eb723f38b07d6e474795a0b6a588d7220400e0f7a4  /tmp/kokoro.tar.bz2" | sha256sum -c -
          tar -xjf /tmp/kokoro.tar.bz2 -C /tmp
          cp /tmp/kokoro-multi-lang-v1_0/{model.onnx,voices.bin,tokens.txt} app/src/main/assets/kokoro/
          cp /tmp/kokoro-multi-lang-v1_0/{LICENSE,README.md} app/src/main/assets/kokoro/
          mkdir -p app/src/main/assets/piper
          curl -fL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/vits-piper-es_ES-davefx-medium.tar.bz2 -o /tmp/piper.tar.bz2
          echo "a3f6beb54a9cb893279f72978a22f807a4d9fc9c7848157b524d5cc7b7f58b22  /tmp/piper.tar.bz2" | sha256sum -c -
          tar -xjf /tmp/piper.tar.bz2 -C /tmp
          P=/tmp/vits-piper-es_ES-davefx-medium
          cp "$P/es_ES-davefx-medium.onnx" app/src/main/assets/piper/model.onnx
          cp "$P"/{tokens.txt,MODEL_CARD} app/src/main/assets/piper/
          mkdir -p app/src/main/assets/supertonic
          curl -fL --retry 3 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/sherpa-onnx-supertonic-3-tts-int8-2026-05-11.tar.bz2 -o /tmp/supertonic.tar.bz2
          echo "82fa96f91c4ef8abaae3a14a3f4153facf88bed821d1f7331cec2700f432c427  /tmp/supertonic.tar.bz2" | sha256sum -c -
          tar -xjf /tmp/supertonic.tar.bz2 -C /tmp
          S=/tmp/sherpa-onnx-supertonic-3-tts-int8-2026-05-11
          cp "$S"/{duration_predictor.int8.onnx,text_encoder.int8.onnx,vector_estimator.int8.onnx,vocoder.int8.onnx,tts.json,unicode_indexer.bin,voice.bin} app/src/main/assets/supertonic/
          curl -fL --retry 3 https://huggingface.co/Supertone/supertonic-3/resolve/3cadd1ee6394adea1bd021217a0e650ede09a323/LICENSE -o app/src/main/assets/supertonic/LICENSE
          echo "0d944a9110fed9a9602d60e0423a272903e7bd21ab060490774efc77c2275e9f  app/src/main/assets/supertonic/LICENSE" | sha256sum -c -
      - name: Inspect native runtime
        run: |
          mkdir -p compliance
          unzip -q app/libs/sherpa.aar -d /tmp/runtime-aar
          find /tmp/runtime-aar -name '*.so' -print | while read -r f; do
            echo "$f"
            readelf -d "$f"
            readelf -Ws "$f" | grep -Ei 'espeak|phonemize' || true
            strings "$f" | grep -Ei 'espeak|piper.phonemize' | head -50 || true
          done > compliance/native-inspection.txt
          if grep -E 'espeak-ng-data|/tmp/espeak|espeak_Initialize' compliance/native-inspection.txt; then
            echo "Unexpected eSpeak marker in the UNAM runtime"
            exit 1
          fi
      - name: Bundle verified PocketTTS model
        run: bash scripts/fetch-pocket-es.sh app/src/main/assets/pocket
      - name: Compile native MP3 encoder
        run: bash scripts/build-mp3.sh
      - name: Collect dependency and license evidence
        run: |
          mkdir -p compliance app/src/main/assets/licenses
          cp THIRD_PARTY_NOTICES.md POCKET-NOTICE.md SUPERTONIC-NOTICE.md app/src/main/assets/licenses/
          gradle -PvoxPhonemizer=unam :app:dependencies --configuration debugRuntimeClasspath --no-daemon > compliance/runtime-dependencies.txt
          unzip -l app/libs/sherpa.aar > compliance/sherpa-archive.txt
          find app/src/main/assets -type f \( -iname '*license*' -o -iname '*notice*' -o -iname 'MODEL_CARD' \) > compliance/license-files.txt
          sha256sum app/libs/sherpa.aar > compliance/native-sha256.txt
          sha256sum /tmp/{kokoro,piper,supertonic}.tar.bz2 compliance/lame/lame.tar.gz > compliance/archive-sha256.txt
          find app/src/main/assets -type f -print0 | sort -z | xargs -0 sha256sum > compliance/asset-sha256.txt
          mkdir -p compliance/android-native
          unzip -q app/libs/sherpa.aar 'jni/arm64-v8a/*.so' -d compliance/android-native
          for library in compliance/android-native/jni/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/*.so; do
            sha256sum "$library"
            readelf -d "$library"
          done > compliance/native-arm64.txt
          rm -r compliance/android-native
      - run: gradle -PvoxPhonemizer=unam :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-runtime-compliance
          path: compliance/
      - name: Verify ARM64 APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$TOOLS/apksigner" verify "$APK"
          python3 scripts/verify-apk.py "$APK" --phonemizer unam
          (cd "$(dirname "$APK")" && sha256sum "$(basename "$APK")" > APK.sha256)
      - name: Upload JVM test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-tests
          path: app/build/test-results/testDebugUnitTest/*.xml
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-android-runtime-2
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/APK.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: VoxNatural-UNAM-device-tests
          if-no-files-found: error
          path: app/build/outputs/apk/androidTest/debug/*.apk
