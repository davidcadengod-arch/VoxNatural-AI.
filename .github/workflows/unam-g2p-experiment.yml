name: UNAM G2P synthesis and dependency audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/unam-g2p-experiment.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthesis:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        model: [kokoro, piper]
        runtime: ['2.0.1']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install sherpa-onnx==${{ matrix.runtime }} numpy unam-g2p==0.1.0
      - name: Audit installed package
        run: |
          mkdir -p evidence
          pip inspect > evidence/dependencies.json
          pip check
          python - <<'PY'
          import importlib.metadata as m
          d=m.distribution('unam-g2p')
          print(d.metadata.get('License-Expression'),d.requires)
          assert d.metadata.get('License-Expression')=='Apache-2.0'
          from pathlib import Path
          for f in d.files:
              if 'license' in str(f).lower() or 'notice' in str(f).lower():
                  Path('evidence',f.name).write_bytes(d.locate_file(f).read_bytes())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: unam-audit-${{ matrix.model }}
          path: evidence/
      - name: Fetch model and synthesize
        env:
          MODEL: ${{ matrix.model }}
        run: |
          case "$MODEL" in
            supertonic) archive=sherpa-onnx-supertonic-3-tts-int8-2026-05-11 ;;
            kokoro) archive=kokoro-multi-lang-v1_0 ;;
            piper) archive=vits-piper-es_ES-davefx-medium ;;
          esac
          curl -fL --retry 3 "https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/$archive.tar.bz2" -o /tmp/model.tar.bz2
          tar -xjf /tmp/model.tar.bz2
          export MODEL_DIR="$PWD/$archive"
          python - <<'PY'
          import os, wave, numpy as np, sherpa_onnx as s
          from pathlib import Path
          p=Path(os.environ["MODEL_DIR"])
          kind=os.environ["MODEL"]
          def f(n): return str(p/n)
          from unam_g2p import IPA29
          import re, unicodedata
          text="La mañana llegó lentamente. ¿Qué encontraríamos al otro lado?"
          words=re.findall(r'[^\W\d_]+',text.lower())
          vocab={line.rsplit(maxsplit=1)[0] for line in (p/'tokens.txt').read_text().splitlines() if len(line.rsplit(maxsplit=1))==2}
          lex=p/'unam-lexicon.txt'
          with lex.open('w') as out:
              for word in sorted(set(words)):
                  phones=[]
                  for token in IPA29(word).split():
                      if token in ('.','/'): continue
                      token={'ʧ':'tʃ','ʤ':'dʒ'}.get(token,token).replace('g','ɡ') if 'ɡ' in vocab else {'ʧ':'tʃ','ʤ':'dʒ'}.get(token,token)
                      base=unicodedata.normalize('NFD',token)
                      if '\u0301' in base:
                          phones.append('ˈ'); token=base.replace('\u0301','')
                      phones.extend(token if token not in vocab else [token])
                  missing=set(phones)-vocab
                  assert not missing,(word,missing)
                  print(word, phones)
                  out.write(word+' '+' '.join(phones)+'\n')
          if kind=="supertonic":
              model=s.OfflineTtsModelConfig(supertonic=s.OfflineTtsSupertonicModelConfig(duration_predictor=f("duration_predictor.int8.onnx"),text_encoder=f("text_encoder.int8.onnx"),vector_estimator=f("vector_estimator.int8.onnx"),vocoder=f("vocoder.int8.onnx"),tts_json=f("tts.json"),unicode_indexer=f("unicode_indexer.bin"),voice_style=f("voice.bin")),num_threads=4,provider="cpu")
          elif kind=="kokoro":
              model=s.OfflineTtsModelConfig(kokoro=s.OfflineTtsKokoroModelConfig(model=f("model.onnx"),voices=f("voices.bin"),tokens=f("tokens.txt"),lexicon=str(lex),lang="es"),num_threads=4,provider="cpu")
          else:
              model=s.OfflineTtsModelConfig(vits=s.OfflineTtsVitsModelConfig(model=f("es_ES-davefx-medium.onnx"),tokens=f("tokens.txt"),lexicon=str(lex)),num_threads=4,provider="cpu")
          tts=s.OfflineTts(s.OfflineTtsConfig(model=model))
          text="La mañana llegó lentamente. ¿Qué encontraríamos al otro lado?"
          if kind=="supertonic":
              cfg=s.GenerationConfig()
              cfg.sid=0
              cfg.num_steps=8
              cfg.extra={"lang":"es"}
              audio=tts.generate(text,cfg)
          else:
              audio=tts.generate(text,sid=28 if kind=="kokoro" else 0,speed=0.97)
          a=np.asarray(audio.samples)
          assert a.size>audio.sample_rate and np.isfinite(a).all() and np.max(np.abs(a))>0.001
          with wave.open("sample.wav","wb") as out:
              out.setnchannels(1);out.setsampwidth(2);out.setframerate(audio.sample_rate)
              out.writeframes((np.clip(a,-1,1)*32767).astype("<i2").tobytes())
          print(kind,a.size,audio.sample_rate)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: unam-sample-${{ matrix.model }}-${{ matrix.runtime }}
          path: sample.wav
